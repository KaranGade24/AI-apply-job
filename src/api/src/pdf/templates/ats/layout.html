<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{name}} - Resume</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    {{{themeCss}}}
  </style>
  <script>
    (function autoFitToPage() {
      function adjustScale() {
        // Skip if already handled by PDF renderer
        if (window.isPdfRendering) return;

        const pageEl = document.querySelector('.resume') || document.querySelector('.page');
        if (!pageEl) return;

        const targetPages = parseInt(document.body.getAttribute('data-target-pages') || '1', 10);

        const probe = document.createElement('div');
        probe.style.cssText = 'position:absolute;visibility:hidden;height:297mm;width:1px;top:0;left:0;';
        document.body.appendChild(probe);
        const a4HeightPx = probe.getBoundingClientRect().height;
        document.body.removeChild(probe);

        const printablePageHeightPx = (272.5 / 297) * a4HeightPx;

        const prevMinHeight = pageEl.style.minHeight;
        pageEl.style.minHeight = '0px';
        pageEl.style.width = '210mm';

        const getRequiredPageCount = () => {
          const height = pageEl.getBoundingClientRect().height;
          return Math.ceil(height / printablePageHeightPx);
        };

        let minScale = 0.35;
        let maxScale = 1.50;
        let bestScale = 1.0;

        for (let i = 0; i < 35; i++) {
          const midScale = (minScale + maxScale) / 2;
          document.documentElement.style.setProperty('--scale-factor', midScale.toFixed(5));
          if (getRequiredPageCount() <= targetPages) {
            bestScale = midScale;
            minScale = midScale;
          } else {
            maxScale = midScale;
          }
        }

        document.documentElement.style.setProperty('--scale-factor', bestScale.toFixed(5));
        pageEl.style.minHeight = prevMinHeight;
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', adjustScale);
      } else {
        adjustScale();
      }
      window.addEventListener('resize', adjustScale);
    })();
  </script>
</head>
<body data-target-pages="{{targetPages}}" data-scale-multiplier="{{scaleMultiplier}}" style="--target-pages: {{targetPages}};">
  <main class="resume">
    {{{sections.header}}}
    {{{sections.summary}}}
    {{{sections.skills}}}
    {{{sections.projects}}}
    {{{sections.experience}}}
    {{{sections.education}}}
    {{{sections.certifications}}}
  </main>
</body>
</html>
